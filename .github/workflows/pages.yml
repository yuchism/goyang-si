name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: '시간·TV·행동 검사 건너뛰기 (급한 수정만. STABILITY_PLAN.md 5장)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check image list (meta.json)
        run: python3 tools/build_meta.py --check
      # 배포 전 검사 (STABILITY_PLAN.md 5장 ③-a). 하나라도 실패하면 배포하지 않는다.
      # 손으로 실행(workflow_dispatch)할 때 skip_checks를 켜면 건너뛴다. push일 때는 inputs가 비어 있어 늘 돈다
      - name: Set up Node
        if: ${{ !inputs.skip_checks }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check time (tools/check_time.mjs)
        if: ${{ !inputs.skip_checks }}
        run: node tools/check_time.mjs
      - name: Check TV (tools/check_tv.mjs)
        if: ${{ !inputs.skip_checks }}
        run: node tools/check_tv.mjs
      # 행동 검사 짧은 묶음 (STABILITY_PLAN.md 5장 ③-b). 처음 1~2주는 실패해도 배포는 한다(continue-on-error):
      # 가끔 흔들리는 검사가 없는지 본 뒤, 괜찮으면 continue-on-error 두 줄을 지워 막는 쪽으로 바꾼다
      - name: Install Playwright (Chromium)
        if: ${{ !inputs.skip_checks }}
        continue-on-error: true
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Check behavior (tools/check_behave.mjs --quick)
        if: ${{ !inputs.skip_checks }}
        continue-on-error: true
        run: node tools/check_behave.mjs --quick
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp service worker version
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/" web/sw.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
