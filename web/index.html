<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고양.시</title>
<meta name="description" content="강고양이 씨가 사는 방. 실제 시간에 맞춰 졸고, 햇빛을 따라가고, 가끔 쥐야쥐를 쫓는다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>

:root{
  --night:#17130f;      /* 방 밖 어둠 */
  --frame:#2a231d;      /* 액자, 패널 */
  --paper:#f3e6cf;      /* 글자 */
  --muted:#a8977f;      /* 보조 글자 */
  --bell:#e9c14d;       /* 강고양이 씨 방울 */
  --line:#4a3e33;
  --font-hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;min-height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--font-body);overflow:hidden}
.app{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;box-sizing:border-box;max-width:1400px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--font-hand);font-weight:700;font-size:1.9rem;letter-spacing:.02em;line-height:1}
.mark b{color:var(--bell);font-weight:700}
.status{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.45);touch-action:manipulation;cursor:default;max-width:100%}
footer{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:.82rem;color:var(--paper);background:var(--frame);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--bell);outline-offset:2px}
button[aria-pressed="true"]{background:var(--bell);color:#2a1f0e;border-color:var(--bell)}
.hint{font-size:.75rem;color:var(--muted)}
.dev{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--frame);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.8rem}
.dev[hidden]{display:none}
.dev .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dev label{color:var(--muted)}
.dev input[type=range]{width:160px;accent-color:var(--bell)}
.note{position:absolute;left:50%;bottom:6%;transform:translateX(-50%) rotate(-1.5deg);background:#f7e27a;color:#2b2416;font-family:var(--font-hand);font-size:1.5rem;line-height:1.25;padding:16px 20px 18px;width:min(320px,80%);box-shadow:0 10px 30px rgba(0,0,0,.4);border-radius:2px;cursor:pointer}
.note small{display:block;font-size:.95rem;opacity:.65;margin-top:6px}
.screen{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:#101820;color:#cfe3d6;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.5;padding:14px 16px;width:min(420px,86%);border-radius:8px;border:6px solid #2f3a44;white-space:pre-wrap;word-break:break-all;cursor:pointer;max-height:50%;overflow:auto}
.birthday{position:absolute;left:50%;top:4%;z-index:4;transform:translateX(-50%) rotate(-1deg);max-width:calc(100% - 32px);padding:9px 22px 10px;background:#f7e27a;color:#352711;border:2px solid #9b6d2e;border-radius:4px;box-shadow:0 7px 18px rgba(0,0,0,.3);font-family:var(--font-hand);font-size:clamp(1.15rem,3vw,1.75rem);font-weight:700;line-height:1.1;text-align:center;white-space:nowrap;pointer-events:none}
.birthday::before,.birthday::after{content:"🎈";position:absolute;top:50%;transform:translateY(-50%)}
.birthday::before{left:-18px}.birthday::after{right:-18px}
.birthday[hidden]{display:none}
.a11y{position:absolute;left:8px;top:8px;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;z-index:6}
.a11y:focus-within{width:auto;height:auto;margin:0;overflow:visible;clip:auto;clip-path:none;white-space:normal;display:flex;gap:6px}
.a11y button{background:#17130f}
@media (max-width:560px){.mark{font-size:1.5rem}.hint{display:none}.status{font-size:.74rem}}
@media (max-height:520px){header{display:none}.hint{display:none}.app{padding-block:6px;gap:6px}footer{flex-wrap:nowrap;justify-content:flex-end}}
@media (max-height:520px),(max-width:560px){.dev{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 48px);max-height:42vh;overflow:auto;z-index:5;background:rgba(30,26,22,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);gap:8px 12px;padding:8px 10px}.dev input[type=range]{width:120px}}
.stagewrap canvas{border-radius:6px}
</style>

<div class="app">
  <header>
    <div class="mark">고양<b>.</b>시</div>
    <div class="status" id="status">…</div>

    </div>
  </div>
  <footer>
    <div class="hint">강고양이 씨를 톡 건드려 보세요. 너무 자주는 말고요. 벽의 노란 쪽지와 노트북도 눌러볼 수 있어요.</div>
    <div class="btns">
      <button id="bSound" aria-pressed="false">소리 켜기</button>
      <button id="bFull">전체 화면</button>
      <button id="bDev" aria-pressed="false">미리보기 도구</button>
    </div>
  </footer>
</div>

  const r=rs.find(r=>crosses(r,x0,y0,tx,ty));if(!r||depth<=0)return [[tx,ty]];
  const fy=Math.min(r.y1+14,740),by=Math.max(r.y0-10,592);
  const wy=(Math.abs(y0-fy)+Math.abs(ty-fy))<=(Math.abs(y0-by)+Math.abs(ty-by))?fy:by;
  const L=r.x0-16,Rr=r.x1+16,right=tx>x0,pts=[];
  if(x0>r.x0&&x0<r.x1)pts.push([x0,wy]);else pts.push([right?L:Rr,wy]);
  if(!(tx>r.x0&&tx<r.x1))pts.push([right?Rr:L,wy]);else pts.push([tx,wy]);
  pts.push([tx,ty]);
  const out=[];let px=x0,py=y0;for(const [qx,qy] of pts){out.push(...detour(rs.filter(q=>q!==r),px,py,qx,qy,depth-1));px=qx;py=qy}return out;
}
function routeTo(a,tx,ty,free){

  for(const r of rs)if(inRect(r,tx,ty))ty=(a.y<(r.y0+r.y1)/2&&r.y0-8>=592)?r.y0-8:Math.min(r.y1+10,740);
  return detour(rs,a.x,a.y,tx,ty,4);
}

  const m=Math.min(d,sp*dt);a.x+=dx/d*m;a.y+=dy/d*m;return d-m<3}

    if(a.tr){a.tr.t+=dt;if(a.tr.t>=a.tr.dur){a.dp=a.tr.to;a.tr=null}}
    if(!a.tr&&a.dp!==a.pose){const n=nextHop(a.dp,a.pose),e=EDGE[a.dp+'>'+n];if(e){a.tr={name:e[0],from:a.dp,to:n,t:0,dur:e[1]};if(e[0]==='rise'&&Math.random()<0.5)a.yawn=1}else a.dp=a.pose}

  const t=(h-(r+0.6))/((s-0.4)-(r+0.6));

  let k=Math.sin(Math.PI*t);k=Math.pow(k,0.6);

  const sk=lerp(-120,120,t);

}

const RAIN_SLANT=0.18;

let brainT=0,mouseT=rnd(10,25),ambT=0;
function frame(tNow){
  const real=Math.min(0.1,(tNow-lastReal)/1000);lastReal=tNow;
  simMs+=real*1000*speed;
  const bf=speed===1?1:speed===60?4:12;
  const dt=real*bf;world.t+=real;
  const d=now();
  scheduled(d);
  world.dark=darkness(d);
  // 소음 게이지와 방문
  world.noise=Math.max(0,world.noise-dt*0.02);
  const home=mandukHome(d),asleep=mandukAsleep(d);
  if(home&&!world.manduk&&world.visitsToday<8&&world.t-world.lastVisit>60){
    if(world.noise>(asleep?1.25:0.8)){world.noise=0;startVisit(asleep?'night':'noise')}
    else if(!asleep&&isWeekend(d)&&Math.random()<dt/900)startVisit('check');
  }
  if(!home)world.noise=Math.max(0,world.noise-dt*0.05);
  // 쥐야쥐 등장
  world.mouseCool=Math.max(0,world.mouseCool-dt);
  mouseT-=dt;
  if(mouseT<=0){mouseT=rnd(25,45);
    if(mouse.hidden&&!world.manduk&&world.mouseCool<=0){const h=hourOf(d);let p=0.05;
      if(!home)p=0.45;else if(asleep)p=0.22;else if(isWeekend(d))p=0.06;else p=0.12;if(rainNow(d))p+=0.2;
      if(Math.random()<p)spawnMouse(d)}
  }
  if(!mouse.hidden){mouse.outFor-=dt;if(!mouse.steps.length&&!mouse.cur)mouseBrain(d)}
  // 같이 낮잠 → 뒤척임 → 화들짝
  if(!mouse.hidden&&mouse.state==='nap'&&mouse.closed&&cat.tag==='nap'&&cat.closed&&Math.abs(cat.x-mouse.x)<190){
    mouse.napTogether=(mouse.napTogether||0)+dt;
    if(mouse.napTogether>rnd(40,90)){mouse.napTogether=0;const keep=cat.steps;cat.pose='roll';cat.rock=1;setTimeout(()=>{cat.rock=0;cat.pose='loaf'},2600);
      mouse.state='flee';say(mouse,'‼️',2);run(mouse,[hold(0.5,'walk'),go(S('hole.out')[0],S('hole.out')[1],MOUSE_RUN),fn(a=>{a.hidden=true;a.state='';a.where='hole'})],'flee')}
  }
  // 자는 강고양이 씨 앞을 지나가는 쥐야쥐
  if(!mouse.hidden&&cat.closed&&cat.tag==='nap'&&mouse.state!=='nap'&&Math.abs(cat.x-mouse.x)<120&&!cat.peeked){cat.peeked=true;const rest=cat.steps,cur=cat.cur;
    run(cat,[hold(2.5,'loaf',false),bub('🐭 … 🙄',3),hold(1,'loaf',true),hold(rnd(40,90),'loaf',true)],'nap');setTimeout(()=>cat.peeked=false,60000)}
  // 서로 의식하기
  if(!mouse.hidden&&!mouse.peek&&!world.manduk){const dd=Math.hypot(cat.x-mouse.x,cat.y-mouse.y);
    if(dd<420&&!cat.moving&&!cat.act&&!cat.tr&&!cat.closed&&!cat.inBox&&cat.tag!=='window')cat.face=mouse.x>cat.x?1:-1;
    if(dd<300&&!mouse.moving&&!mouse.closed&&mouse.state!=='flee')mouse.face=cat.x>mouse.x?1:-1;
    if(dd<420&&!cat.duetT)cat.duetT=world.t;} else cat.duetT=0;
  // 햇빛 따라가기
  const b=sunbeam(d);
  if(cat.tag==='nap'&&cat.closed&&b&&b.k>0.4&&!inBeam(b,cat.x)&&Math.abs(cat.x-b.cx)<300&&Math.random()<dt/20){
    run(cat,[hold(0.8,'loaf'),bub('☀️➡️ 😑',3.5),hold(2,'loaf'),go(b.cx+rnd(-30,30),cat.y,40),hold(1,'loaf'),hold(rnd(60,160),'loaf',true)],'nap')}
  // 나비
  const ss=season(d),hr=hourOf(d),[sr,sset]=sunTimes(d);
  if(!world.bfly&&!world.manduk&&hr>sr+1&&hr<sset-1&&!rainNow(d)&&(ss==='spring'||ss==='summer')&&Math.random()<dt/(ss==='summer'?420:700))spawnButterfly();
  updateButterfly(real*Math.min(bf,3));
  maybeUFO(d,real);maybeSanta(d,real);
  // 컵
  const c=world.cup;if(c.state==='falling'){c.fall+=dt*1.6;c.fy=c.y+c.fall*c.fall*90;c.x+=dt*40;if(c.fy>=640){c.fy=640;c.state='floor';Snd.clink()}}
  // 뇌
  if(!cat.steps.length&&!cat.cur&&!world.manduk)catBrain(d);
  tickActor(cat,dt);tickActor(mouse,dt);
  if(cat.moving){cat.stepT-=dt;if(cat.stepT<=0){cat.stepT=0.42*rnd(0.8,1.2);Snd.bell(0.8)}}
  updateManduk(real);
  if(world.paw){world.paw.t+=real;if(world.paw.t>2.5)world.paw=null}
  // 소리 환경
  ambT-=real;if(ambT<=0){ambT=0.5;const tv=home&&!asleep&&isWeekend(d)&&hr>10&&hr<22&&!world.manduk;Snd.setAmb(rainNow(d)&&!snowing(d),tv,world.dark>0.5);
    if(tv&&Math.random()<0.012)caption(pick(['…TV 소리…','…설거지 소리…','…통화 중: 네네~ 엄마…','…청소기 소리…']),3);}
  // annoy 회복
  annoyT+=real;if(annoyT>20){annoyT=0;annoy=Math.max(0,annoy-1)}
  render(d,real);
  document.getElementById('status').textContent=statusText(d);
  if(devOpen)document.getElementById('hourv').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  requestAnimationFrame(frame);
}
function render(d,real){
  world.renderDt=real;updateCam(real);const {s,dpr}=view;ctx.setTransform(s*dpr,0,0,s*dpr,-cam.x*s*dpr,0);ctx.clearRect(cam.x,0,W,H);
  drawRoom(d);drawSunbeam(d);
  // 소품과 캐릭터를 바닥에 닿는 위치 순서로 그린다 (뒤에 있으면 가려짐)
  const L=OBJ.filter(o=>o.layer==='floor'&&present(o)).map(o=>[depthOf(objView(o)),()=>drawObj(o,d)]);
  const c=world.cup;
  L.push([cat.inBox?P.box.y:cat.y,()=>drawActor(cat)]);L.push([mouse.y,()=>drawActor(mouse)]);
  L.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
  if(c.state==='falling')drawCup(c.x,c.fy,c.fall*4);
  drawButterfly();
  drawManduk('legs');
  // 어둠과 램프
  const dk=world.dark;if(dk>0){ctx.fillStyle=`rgba(16,20,46,${world.lampOn?dk*0.6:dk})`;ctx.fillRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(P.window.x,0,P.window.w,P.window.h);ctx.clip();ctx.fillStyle=`rgba(16,20,46,${-dk*0.5})`;ctx.restore()}
  if(world.lampOn&&dk>0.05){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(P.lamp.x,P.lamp.y-60,10,P.lamp.x,P.lamp.y,520);g.addColorStop(0,`rgba(255,200,120,${0.35*dk})`);g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore()}
  drawManduk('say');
  drawBubble(cat);drawBubble(mouse);
  if(world.paw){const p=world.paw,k=p.t/2.5;ctx.save();ctx.globalAlpha=1-k;ctx.strokeStyle='#fffaf0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,20+k*60,0,7);ctx.stroke();ctx.restore()}
  drawCaptions(real);
}

  if(hitActor(mouse,x,y)){say(mouse,'‼️',1.5);mouseHide(true);return}

});

document.getElementById('aCat').onclick=()=>petCat();
document.getElementById('aMouse').onclick=()=>{if(!mouse.hidden&&!mouse.peek){say(mouse,'‼️',1.5);mouseHide(true)}};
document.getElementById('aNote').onclick=TOUCH.note;
document.getElementById('aScreen').onclick=TOUCH.screen;
function petCat(){
  if(world.manduk)return;annoy++;annoyT=0;
  if(cat.act&&cat.act.c==='box'){say(cat,'❔',2);return}
  if(annoy<=2){say(cat,cat.closed?'❔💤':'❔',2.5);if(cat.closed){const was=cat.closed;cat.closed=false;setTimeout(()=>{if(cat.tag==='nap'||cat.tag==='innocent')cat.closed=true},1400)}if(annoy===1&&cat.pose==='roll')Snd.purr(2)}
  else if(annoy<=4){say(cat,'💢',2.5);cat.rock=1;setTimeout(()=>cat.rock=0,1200)}
  else{annoy=2;const tx=cat.x<600?rnd(800,1000):rnd(150,350);
    run(cat,[bub('💢💢',2.5),hold(1,'stand'),go(tx,rnd(660,720),70),play('sulk',rnd(40,90)),bub('😑',3),hold(20,'loaf',true)],'sulk')}
}

/* ───────── 버튼 ───────── */
const $=id=>document.getElementById(id);
let devOpen=false,wake=null;
async function wakeLock(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(Snd.on||document.fullscreenElement))wakeLock()});
$('bSound').onclick=()=>{const on=Snd.toggle();$('bSound').setAttribute('aria-pressed',on);$('bSound').textContent=on?'소리 끄기':'소리 켜기';if(on){wakeLock();Snd.bell()}};
$('bFull').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else{await document.documentElement.requestFullscreen();wakeLock()}}catch(e){}};
$('bDev').onclick=()=>{devOpen=!devOpen;$('dev').hidden=!devOpen;$('bDev').setAttribute('aria-pressed',devOpen);store.set('dev',devOpen);requestAnimationFrame(fit)};
if(store.get('dev',false)){devOpen=true;$('dev').hidden=false;$('bDev').setAttribute('aria-pressed','true')}
[['sp1',1],['sp60',60],['sp1440',1440]].forEach(([id,v])=>$(id).onclick=()=>{speed=v;['sp1','sp60','sp1440'].forEach(i=>$(i).setAttribute('aria-pressed',i===id))});
$('hour').oninput=e=>{const d=now();const target=new Date(d);const hv=+e.target.value;target.setHours(Math.floor(hv),Math.round((hv%1)*60),0,0);simMs=target.getTime();
  // 건너뛴 일정은 실행하지 않음
  const h=hourOf(now());world.doneToday={};world.dayKey=dayKey(now());world.lampOn=h>=sunTimes(now())[1]-0.3&&h<23;
  if(!world.manduk){cat.steps=[];cat.cur=null}};
$('dayNext').onclick=()=>{simMs+=86400000;world.dayKey='';};
$('dMouse').onclick=()=>{world.mouseCool=0;mouse.where='hole';spawnMouse(now(),true)};
$('dBfly').onclick=()=>spawnButterfly();
$('dMan').onclick=()=>{if(!mandukHome(now())){caption('(만득 씨는 지금 회사에 있어요)',3);return}startVisit(world.cup.state==='floor'?'noise':mandukAsleep(now())?'night':'check')};
$('dRain').onclick=()=>{rainOverride=!rainNow(now())};
$('dBox').onclick=()=>{boxOverride=!boxToday(now())};
$('dSecret').onclick=()=>{if(world.manduk)return;secretB()};
const SEASONS=[null,'spring','summer','autumn','winter'];
$('dSeason').onclick=()=>{seasonOverride=SEASONS[(SEASONS.indexOf(seasonOverride)+1)%SEASONS.length];caption(seasonOverride?'('+SEASON_KO[seasonOverride]+')':'(실제 계절)',2.5)};
$('dXmas').onclick=()=>{holidayOverride=holidayOverride==='christmas'?null:'christmas';caption(holidayOverride?'(크리스마스 시즌)':'(실제 날짜)',2.5)};
$('dSanta').onclick=()=>startSanta();
$('dUfo').onclick=()=>{if(world.manduk){caption('(만득 씨가 있을 땐 오지 않아요)',3);return}startUFO()};
$('dKnock').onclick=()=>{if(world.manduk)return;world.cup.state='table';knockB()};

// 확인용 (화면에는 영향 없음)
window.__goyang={O,startUFO,greetS,chaseS,stalkS,boxHideS,napNextTo,duetB,cat,mouse,world,run,play,hold,go,fn,bub,say,startVisit,spawnMouse,spawnButterfly,groomB,boxB,rollB,windowB,pawB,secretB,knockB,petCat,now};
/* ───────── 시작 ───────── */
const names=Object.keys(SRC);let loaded=0;
try{document.fonts&&document.fonts.load('700 30px Gaegu')}catch(e){}
function loadImages(){names.forEach(k=>{const im=new Image();const done=()=>{if(++loaded===names.length)start()};im.onload=done;im.onerror=done;im.src=SRC[k];IMG[k]=im})}
fetch('objects.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(initObjects).catch(()=>initObjects(OBJECTS_FALLBACK)).finally(loadImages);
function start(){fit();const d=now();world.dayKey=dayKey(d);const h=hourOf(d);
  world.lampOn=h>=sunTimes(d)[1]-0.3&&h<23;
  const b=sunbeam(d);if(b&&b.k>0.4){cat.x=b.cx;cat.y=684;run(cat,[hold(rnd(30,90),'loaf',true)],'nap');cat.closed=true}
  else{cat.x=560;cat.y=690;run(cat,[hold(rnd(15,30),'loaf')],'loaf')}
  cat.dp=cat.pose='loaf';
  requestAnimationFrame(t=>{lastReal=t;frame(t)});
}
})();
</script>
